<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Premium Calculator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="background-blobs"></div>
  <div class="calculator">
    <div class="display-container">
      <div id="previous-operand"></div>
      <input type="text" id="display" placeholder="0" disabled />
    </div>
    <div class="buttons">
      <button onclick="appendValue('(')" class="btn-util">(</button>
    <button onclick="appendValue(')')" class="btn-util">)</button>
    <button onclick="clearDisplay()" class="btn-clear">AC</button>
    <button onclick="deleteLast()" class="btn-util">DEL</button>
      <button onclick="appendValue('/')" class="btn-op">÷</button>

      <button onclick="appendValue('7')">7</button>
      <button onclick="appendValue('8')">8</button>
      <button onclick="appendValue('9')">9</button>
      <button onclick="appendValue('*')" class="btn-op">×</button>

      <button onclick="appendValue('4')">4</button>
      <button onclick="appendValue('5')">5</button>
      <button onclick="appendValue('6')">6</button>
      <button onclick="appendValue('-')" class="btn-op">−</button>

      <button onclick="appendValue('1')">1</button>
      <button onclick="appendValue('2')">2</button>
      <button onclick="appendValue('3')">3</button>
      <button onclick="appendValue('+')" class="btn-op">+</button>

      <button onclick="appendValue('0')" class="col-2">0</button>
      <button onclick="appendValue('.')">.</button>
      <button onclick="calculate()" class="btn-equal">=</button>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
